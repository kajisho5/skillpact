name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { python: ["3.11", "3.12", "3.13"] }
    env: { SKILLPACT_TIMEOUT_SCALE: "2" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: ffmpeg 8.1 (Ubuntu's 6.1 hangs in media.pad; tracked as an ffmpeg-skill compat issue)
        run: |
          curl -sL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz | tar xJ
          echo "$PWD/$(ls -d ffmpeg-n8.1-*)/bin" >> "$GITHUB_PATH"
      - run: ffmpeg -version | head -1
      - name: sandbox for conformance tests (bubblewrap; needs unprivileged user namespaces)
        run: sudo apt-get install -y -q bubblewrap && sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cd ref && pip install -e .[test,sigstore]
      - run: cd ref && python -m pytest -q tests
      - name: flagship conformance (L3)
        run: cd ref && python -m skillpact.cli conformance ../samples/ffmpeg-skill --trusted-key "ed25519:moqKymSKFxCPXkaxDtETg/Qd8GvRwg8ckWAWIRQJXSQ="
      - name: conformance suite (reference implementation)
        run: cd ref && python ../conformance/run.py --cmd "python -m skillpact.cli validate {dir}" > /dev/null
      - name: v0.8 conformance cases are reproducible from gen_v08.py
        run: python conformance/gen_v08.py && git diff --exit-code conformance/
      - name: example skills reach L3
        run: |
          pip install -q Pillow   # thumbnail-skill requirement (requirements.packages)
          cd ref
          for s in subtitle-skill thumbnail-skill video-editing-skill; do
            python -m skillpact.cli conformance ../samples/$s --trusted-key "ed25519:moqKymSKFxCPXkaxDtETg/Qd8GvRwg8ckWAWIRQJXSQ=" | python -c "import json,sys; r=json.load(sys.stdin); print('$s', r['level']); assert r['level']=='L3-signed'"
          done
      - name: schemas in docs and both implementations match
        run: cmp ref/skillpact/schema.json docs/schema/v0.8.json && cmp ref/skillpact/schema.json ts/src/schema.json && cmp ref/skillpact/policy_schema.json docs/schema/policy-v0.8-r2.json

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd ts && npm ci && npm test
      - name: conformance suite (TypeScript implementation)
        run: cd ts && python3 ../conformance/run.py --cmd "node dist/cli.js validate {dir}" > /dev/null
      - name: browser checker bundle is up to date
        run: cd ts && npx esbuild src/browser.ts --bundle --format=iife --minify --target=es2022 --outfile=../docs/check/skillpact-check.js && git diff --exit-code ../docs/check/skillpact-check.js

  macos-sandbox:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: cd ref && pip install -e .
      - name: Seatbelt sandbox blocks network and writes outside $WORKDIR (experimental runner mode)
        run: |
          python - <<'PY'
          import json, shutil, sys, tempfile, pathlib
          sys.path.insert(0, "ref"); from skillpact import core
          tmp = pathlib.Path(tempfile.mkdtemp()); d = tmp / "v08-valid-signed"
          shutil.copytree("conformance/cases/v08-valid-signed", d)
          c = json.loads((d / "skill.contract.json").read_text())
          c["tests"]["setup"] = [["sh", "-c", "echo x > $SKILL_DIR/../escaped.txt; true"]]
          c["tests"]["cases"].append({"id": "net", "capability": "hello", "run": ["sh", "-c", "curl -sS -m 5 https://example.com >/dev/null && echo LEAK || echo blocked"], "expect": {"exit_code": 0, "stdout_contains": "blocked"}})
          c["tests"]["cases"].append({"id": "tamper", "capability": "hello", "run": ["sh", "-c", "echo t >> $SKILL_DIR/SKILL.md 2>/dev/null; echo hi"], "expect": {"exit_code": 0}})
          (d / "skill.contract.json").write_text(json.dumps(c))
          r = core.run_tests(d); print(json.dumps({k: r[k] for k in ("ok", "sandbox", "fs_isolated", "network_isolated", "passed", "total")}))
          print([x for x in r["cases"] if not x["ok"]])
          assert r["sandbox"] == "seatbelt" and r["fs_isolated"] and r["network_isolated"] and r["ok"], r
          assert not (tmp / "escaped.txt").exists() and "\nt\n" not in (d / "SKILL.md").read_text()
          PY
      - name: Seatbelt blocks host Unix sockets even for network cases (0.8.x erratum)
        run: |
          python - <<'PY'
          import socket, subprocess, sys, tempfile, threading, os
          sys.path.insert(0, "ref"); from skillpact import core
          sp = os.path.join(tempfile.mkdtemp(), "host.sock"); srv = socket.socket(socket.AF_UNIX); srv.bind(sp); srv.listen(5)
          threading.Thread(target=lambda: [srv.accept() for _ in range(5)], daemon=True).start()
          w = tempfile.mkdtemp(); code = f"import socket; s=socket.socket(socket.AF_UNIX); s.connect({sp!r}); print('REACHED')"
          r = subprocess.run(core._wrap([sys.executable, "-c", code], "seatbelt", True, w, None), capture_output=True, text=True, timeout=30)
          print(r.returncode, r.stdout, r.stderr[-300:]); assert "REACHED" not in r.stdout
          PY
