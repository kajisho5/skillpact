name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "content/**", "docs/schema/**", "docs/badges/**", "docs/check/**", "ts/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: site/package-lock.json }
      - name: browser checker bundle matches ts/src
        run: cd ts && npm ci && npx esbuild src/browser.ts --bundle --format=iife --minify --target=es2022 --outfile=../docs/check/skillpact-check.js && git diff --exit-code ../docs/check/skillpact-check.js
      - run: cd site && npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with: { path: site/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
