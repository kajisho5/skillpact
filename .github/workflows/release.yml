# Release: build the Python reference implementation (PyPI "skillpact") and the TypeScript verifier (npm "skillpact"),
# attest their provenance, attach them to a GitHub release and, once the editor has enabled it, publish them.
# Trigger: push a tag vX.Y.Z (or vX.Y.ZbN / vX.Y.Z-beta.N for pre-releases), or run manually: with release_tag on main it
# creates that tag and releases (for environments that cannot push tags); without it, a dry run (build only).
# Publishing runs on every tag (enabled by the editor, 2026-10-23). PyPI uses trusted publishing (OIDC); npm uses the
# NPM_TOKEN secret until the package exists and has a trusted publisher. Setup is described in GOVERNANCE.md ("Release").
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release from main without pushing a tag first: the tag to create (e.g. v0.8.0b1). Empty = build only."
        required: false
        default: ""
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # build provenance attestations
      attestations: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: versions agree (tag, pyproject.toml, package.json)
        id: ver
        env: { REL_TAG: "${{ (github.ref_type == 'tag' || (inputs.release_tag != '' && github.ref == 'refs/heads/main')) && (github.ref_type == 'tag' && github.ref_name || inputs.release_tag) || '' }}" }
        run: |
          pip install -q packaging
          python - <<'PY'
          import json, os, tomllib
          from packaging.version import Version
          py = tomllib.load(open("ref/pyproject.toml", "rb"))["project"]["version"]
          js = json.load(open("ts/package.json"))["version"]
          assert Version(py) == Version(js), f"pyproject {py} != package.json {js}"
          if os.environ["REL_TAG"]:
              tag = os.environ["REL_TAG"].removeprefix("v")
              assert Version(tag) == Version(py), f"tag {tag} != version {py}"
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"version={py}\n")
          print("version", py)
          PY
      - name: build Python sdist and wheel
        run: pip install -q build twine && python -m build ref -o dist && twine check dist/*
      - name: build npm package
        run: cd ts && npm ci && npm test && npm pack --pack-destination ../dist
      - name: sha256 of every artifact
        run: cd dist && sha256sum * | tee SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        if: (github.ref_type == 'tag' || (inputs.release_tag != '' && github.ref == 'refs/heads/main'))
        with: { subject-path: "dist/skillpact*" }
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  github-release:
    if: (github.ref_type == 'tag' || (inputs.release_tag != '' && github.ref == 'refs/heads/main'))
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: create the release with the artifacts
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}", REPO: "${{ github.repository }}" }
        run: |
          pre=""; case "$TAG" in *a*|*b*|*rc*|*-*) pre="--prerelease";; esac
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then   # release created in the web UI (it made the tag)
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            verify="--verify-tag"; [ "$GITHUB_REF_TYPE" = tag ] || verify="--target $GITHUB_SHA"   # dispatch: create the tag here
            gh release create "$TAG" dist/* --repo "$REPO" $verify $pre --title "SkillPact $TAG" \
              --notes "See CHANGELOG.md. Artifacts carry GitHub build provenance (gh attestation verify <file> --repo $REPO)."
          fi

  publish-pypi:
    if: (github.ref_type == 'tag' || (inputs.release_tag != '' && github.ref == 'refs/heads/main'))
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - run: mkdir pypi && mv dist/*.whl dist/*.tar.gz pypi/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: pypi/, skip-existing: true }   # a re-run after a partial release

  publish-npm:
    if: (github.ref_type == 'tag' || (inputs.release_tag != '' && github.ref == 'refs/heads/main'))
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: actions/setup-node@v4
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - name: publish with provenance
        env: { VERSION: "${{ needs.build.outputs.version }}", NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }   # first publish; remove once trusted publishing is set
        run: |
          npm install -g npm@latest   # trusted publishing needs a recent npm CLI
          tag=latest; case "$VERSION" in *a*|*b*|*rc*|*-*) tag=next;; esac
          npm publish ./dist/skillpact-*.tgz --access public --provenance --tag "$tag"   # ./ : npm 11 reads dist/x.tgz as a GitHub user/repo
