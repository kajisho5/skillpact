name: "SkillPact verify"
description: "Validate a skill.contract.json (SkillPact), run its conformance tests and report the level (L1 / L2 / L3). Pin to a commit SHA; run on pull_request, not pull_request_target."
author: "SEVENTHWELL"
branding: { icon: "shield", color: "purple" }
inputs:
  path:
    description: "Skill directory (contains SKILL.md and, unless `contract` is set, skill.contract.json)"
    default: "."
  contract:
    description: "Path to the contract (manifest) when it is not <path>/skill.contract.json. Empty = <path>/skill.contract.json"
    default: ""
  python-version:
    description: "Python used to install and run the SkillPact reference implementation (>= 3.11). The skill's own tests run with whatever python3 is first on PATH, which is this one unless a later step changes it"
    default: "3.13"
  trusted-key:
    description: "Space-separated trusted signer keys (ed25519:<b64> or sigstore:<issuer>|<identity>) required for L3"
    default: ""
  run-tests:
    description: "Run the declared conformance tests (needed for L2/L3). Set false for a quick L1 check."
    default: "true"
  min-level:
    description: "Fail the job if the level is below this (L1, L2 or L3)"
    default: "L1"
outputs:
  level:
    description: "Achieved level: none, L1-declared, L2-tested or L3-signed"
    value: ${{ steps.check.outputs.level }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with: { python-version: "${{ inputs.python-version }}" }
    - name: install skillpact (from this action's checkout)
      shell: bash
      run: python -m pip install -q "${{ github.action_path }}/ref"
    - name: sandbox for the declared tests (bubblewrap; spec 0.8 s10)
      if: inputs.run-tests == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get install -y -q bubblewrap >/dev/null || echo "::warning::bubblewrap not installed; tests fall back to unshare -rn (no filesystem isolation), so L2 / L3 cannot be reached"
        sudo apt-get install -y -q strace >/dev/null || echo "::warning::strace not installed; programs started by tests are not checked against permissions.exec"
        sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 || true
    - id: check
      shell: bash
      env:
        SP_PATH: ${{ inputs.path }}
        SP_CONTRACT: ${{ inputs.contract }}
        SP_KEYS: ${{ inputs.trusted-key }}
        SP_TESTS: ${{ inputs.run-tests }}
        SP_MIN: ${{ inputs.min-level }}
      run: python "${{ github.action_path }}/.github/action/verify.py"
